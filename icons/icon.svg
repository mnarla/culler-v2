<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Neon Green Glow Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle with Subtle Neon Border -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Perfectly Centered Skip Glyph (Bounds: 34 to 94 horizontally, 46 to 82 vertically) -->
  <g filter="url(#softGlow)" fill="url(#neonGreen)">
    <!-- First Arrow -->
    <path d="M 34 50 C 34 46.5 37.8 44.3 40.8 46.1 L 56.8 56.1 C 59.5 57.8 59.5 61.8 56.8 63.5 L 40.8 73.5 C 37.8 75.3 34 73.1 34 69.6 Z" />

    <!-- Second Arrow -->
    <path d="M 58 50 C 58 46.5 61.8 44.3 64.8 46.1 L 80.8 56.1 C 83.5 57.8 83.5 61.8 80.8 63.5 L 64.8 73.5 C 61.8 75.3 58 73.1 58 69.6 Z" />

    <!-- Rounded End Bar -->
    <rect x="87" y="46.5" width="7" height="27" rx="3.5" />
  </g>
</svg>
