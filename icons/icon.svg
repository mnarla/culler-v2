<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Neon Green Glow Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle with Subtle Neon Border -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Centered Playful Rounded Skip Chevrons -->
  <g filter="url(#softGlow)" fill="url(#neonGreen)">
    <!-- First Arrow -->
    <path d="M 32 44.5 C 32 40.8 36.1 38.5 39.3 40.5 L 57.5 51.9 C 60.3 53.6 60.3 57.6 57.5 59.4 L 39.3 70.8 C 36.1 72.8 32 70.5 32 66.8 Z" />
    
    <!-- Second Arrow -->
    <path d="M 58 44.5 C 58 40.8 62.1 38.5 65.3 40.5 L 83.5 51.9 C 86.3 53.6 86.3 57.6 83.5 59.4 L 65.3 70.8 C 62.1 72.8 58 70.5 58 66.8 Z" />

    <!-- Rounded End Bar -->
    <rect x="89" y="41" width="7" height="30" rx="3.5" />
  </g>
</svg>
